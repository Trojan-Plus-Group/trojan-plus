# Put in /etc/nginx/conf.d/qmgr.conf (http context). Reload: nginx -t && systemctl reload nginx
server {
    listen 3443 ssl;
    http2 on;
    server_name vpn1.yuchs.com;

    ssl_certificate     /etc/letsencrypt/live/vpn1.yuchs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn1.yuchs.com/privkey.pem;

    location /qmgr/ {
        proxy_pass http://127.0.0.1:3480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE: no buffering, long-lived reads
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64k;
    }

    location / {
        return 404;
    }
}
