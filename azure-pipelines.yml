trigger:
- master

pr:
- master

stages:

- stage: Build
  jobs:

  - job: Linux
    pool:
      vmImage: ubuntu-latest
    container:
      image: trojanplusgroup/centos-build:debian
    steps:
    - checkout: self
      submodules: recursive
    - script: |
        set -euo pipefail
        set -v
        sudo apt-get update
        sudo apt-get install -y cmake
        cmake --version | python3 -c 'import re,sys; v=tuple(map(int,re.search(r"(\d+)\.(\d+)",sys.stdin.read()).groups())); assert v >= (3,22), "BoringSSL requires CMake >= 3.22"'
        mkdir build && cd build
        cmake -DDEFAULT_CONFIG=../config.json -DFORCE_TCP_FASTOPEN=ON -DBoost_USE_STATIC_LIBS=ON -DENABLE_MIMALLOC=ON ..
        make -j$(nproc)
        strip -s trojan
        python3 ../tests/check_dynamic_dependencies.py trojan linux
    - publish: $(System.DefaultWorkingDirectory)/build/trojan
      artifact: LinuxBinary

  - job: LinuxSanitizers
    pool:
      vmImage: ubuntu-latest
    container:
      image: trojanplusgroup/centos-build:debian
    steps:
    - checkout: self
      submodules: recursive
    - script: |
        set -euo pipefail
        set -v
        sudo apt-get update
        sudo apt-get install -y cmake
        cmake --version | python3 -c 'import re,sys; v=tuple(map(int,re.search(r"(\d+)\.(\d+)",sys.stdin.read()).groups())); assert v >= (3,22), "BoringSSL requires CMake >= 3.22"'
        cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DDEFAULT_CONFIG=../config.json -DFORCE_TCP_FASTOPEN=ON -DBoost_USE_STATIC_LIBS=ON \
          -DENABLE_QUIC=ON -DENABLE_MIMALLOC=OFF \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        # Limit sanitizer compile memory on hosted agents.
        cmake --build build-sanitizers --parallel 2
        export TMPDIR="$AGENT_TEMPDIRECTORY/quic-sanitizers"
        mkdir -p "$TMPDIR"
        export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:exitcode=86
        export LSAN_OPTIONS=exitcode=86
        export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:exitcode=86
        scan_sanitizers() {
          status=$?
          trap - EXIT
          if grep -RinE 'AddressSanitizer|LeakSanitizer|UndefinedBehaviorSanitizer|runtime error:' "$TMPDIR"; then
            status=1
          fi
          exit "$status"
        }
        trap scan_sanitizers EXIT
        python3 -u tests/test_quic_shutdown_leaks.py --binary "$PWD/build-sanitizers/trojan" 2>&1 | tee "$TMPDIR/shutdown-output.log"
        python3 -u tests/test_quic_initial_loss.py --binary "$PWD/build-sanitizers/trojan" --output-dir "$TMPDIR" 2>&1 | tee "$TMPDIR/initial-loss-output.log"
      env:
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

  - job: macOS
    pool:
      vmImage: macOS-latest
    steps:
    - checkout: self
      submodules: recursive
    - script: |
        set -euo pipefail
        set -v
        brew install boost cmake
        cmake --version | python3 -c 'import re,sys; v=tuple(map(int,re.search(r"(\d+)\.(\d+)",sys.stdin.read()).groups())); assert v >= (3,22), "BoringSSL requires CMake >= 3.22"'
        mkdir build && cd build
        cmake -DBoost_USE_STATIC_LIBS=ON -DDEFAULT_CONFIG=../config.json -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 -DENABLE_MIMALLOC=ON ..
        make -j$(sysctl -n hw.ncpu)
        strip -SXTx trojan
        python3 ../tests/check_dynamic_dependencies.py trojan macos
    - publish: $(System.DefaultWorkingDirectory)/build/trojan
      artifact: macOSBinary

  - job: Windows
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      submodules: recursive
    - powershell: |
        $ErrorActionPreference = 'Stop'
        choco install nasm --yes --no-progress
        if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
        $nasm = Get-Command nasm.exe -ErrorAction SilentlyContinue
        if (!$nasm) {
          $nasm = Get-ChildItem -Path 'C:\Program Files\NASM', "$env:ChocolateyInstall\lib\nasm*" -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (!$nasm) { throw 'NASM executable not found' }
        $nasmPath = Split-Path $(if ($nasm.Path) { $nasm.Path } else { $nasm.FullName })
        Write-Host "##vso[task.prependpath]$nasmPath"
        $cmakeOut = & cmake --version
        if ($LASTEXITCODE -ne 0) { throw 'CMake version check failed' }
        $first = $cmakeOut[0]
        $version = [version]($first -replace '^cmake version ', '')
        if ($version -lt [version]'3.22') {
          choco upgrade cmake --yes --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
          if ($LASTEXITCODE -ne 0) { throw 'CMake upgrade failed' }
          Write-Host '##vso[task.prependpath]C:\Program Files\CMake\bin'
        }
        exit 0
    - bash: |
        set -euo pipefail
        set -v

        cmake --version | py -3 -c 'import re,sys; v=tuple(map(int,re.search(r"(\d+)\.(\d+)",sys.stdin.read()).groups())); assert v >= (3,22), "BoringSSL requires CMake >= 3.22"'
        nasm -v
        BOOST_VERSION_DOT=1.87.0
        BOOST_VERSION=1_87_0
        
        curl -L -o boost_${BOOST_VERSION}.zip https://archives.boost.io/release/${BOOST_VERSION_DOT}/source/boost_${BOOST_VERSION}.zip
        unzip -q boost_${BOOST_VERSION}.zip
        cd boost_${BOOST_VERSION}
        ./bootstrap.bat
        ./b2 -j$NUMBER_OF_PROCESSORS --with-system --with-program_options variant=release link=static threading=multi runtime-link=static address-model=64
        cd ..

        mkdir build && cd build
        cmake -G "Visual Studio 17 2022" -A x64 -DBOOST_ROOT="$(pwd)/../boost_${BOOST_VERSION}" -DBoost_NO_BOOST_CMAKE=ON -DBoost_USE_STATIC_LIBS=ON -DENABLE_MIMALLOC=ON ..
        cmake --build . --config Release --parallel
        py -3 ../tests/check_dynamic_dependencies.py Release/trojan.exe windows
    - publish: $(System.DefaultWorkingDirectory)/build/Release/trojan.exe
      artifact: WindowsBinary

- stage: Test
  dependsOn: Build
  jobs:
  - job: Linux
    pool:
      vmImage: ubuntu-latest
    container:
      image: trojanplusgroup/centos-build:debian
      options: --privileged
    steps:
    - checkout: self
      submodules: recursive
    - download: current
      artifact: LinuxBinary
    - script: |
        set -euo pipefail
        set -v

        BINARY="$PIPELINE_WORKSPACE/LinuxBinary/trojan"
        chmod +x "$BINARY"

        dependencies_started=$SECONDS
        sudo apt-get update
        sudo apt-get install -y iproute2 iptables nftables build-essential libboost-dev python3-venv
        python3 -m venv "$AGENT_TEMPDIRECTORY/fulltest-venv"
        PYTHON="$AGENT_TEMPDIRECTORY/fulltest-venv/bin/python3"
        "$PYTHON" -m pip install PySocks psutil dnspython aioquic
        echo "CI test dependency setup: $((SECONDS - dependencies_started)) seconds"
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.default.disable_ipv6=0 net.ipv6.conf.lo.disable_ipv6=0
        sudo ip link set lo up
        "$PYTHON" -c 'import socket; s = socket.socket(socket.AF_INET6); s.bind(("::1", 0)); s.close()'
        export S5_BINARY="$BINARY"
        for test in tests/test_*.py; do "$PYTHON" -u "$test"; done

        "$PYTHON" -u tests/LinuxFullTest/check_local_fixtures.py
        "$PYTHON" -u tests/LinuxFullTest/check_quic_regressions.py
        "$PYTHON" -u tests/LinuxFullTest/check_quic_resolver_fixtures.py
        "$PYTHON" -u tests/LinuxFullTest/check_h3_fin_retry.py
        "$PYTHON" -u tests/LinuxFullTest/check_t16_quiescence.py
        "$PYTHON" -u tests/LinuxFullTest/check_t16_live_counters.py
        cd tests/LinuxFullTest/
        sudo env TF_BUILD=True TP_IPV6_REQUIRE_ALL=1 "$PYTHON" -u fulltest_main.py "$BINARY" -6
        sudo env TF_BUILD=True TP_IPV6_REQUIRE_ALL=1 "$PYTHON" -u fulltest_main.py "$BINARY" -6 --ipv6-nat --ipv6-include-expected-fail
        sudo env TF_BUILD=True "$PYTHON" -u fulltest_main.py "$BINARY" -g -q -d 5333 -f

        ifconfig
        route -n

        sudo ip tuntap add dev tun0 mode tun user root
        sudo ifconfig tun0 10.0.0.1 netmask 255.255.255.0
        sudo ip link set dev tun0 up mtu 1500 txqueuelen 1000
        sudo ip route add 188.188.188.188/32 dev tun0
        sudo ip route add 199.199.199.199/32 dev tun0

        ifconfig
        route -n
        
        sudo env TF_BUILD=True "$PYTHON" -u fulltest_main.py "$BINARY" -t -n -d 5333
        sudo env TF_BUILD=True "$PYTHON" -u fulltest_main.py "$BINARY" -q
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

  - job: Windows
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      submodules: recursive
    - download: current
      artifact: WindowsBinary
    - bash: |
        set -euo pipefail
        set -v
        BINARY="$PIPELINE_WORKSPACE/WindowsBinary/trojan.exe"
        py -3 -m pip install PySocks psutil dnspython aioquic
        cd tests/LinuxFullTest/
        py -3 -u fulltest_main.py $BINARY -g -n -d 5333 -f
        py -3 -u fulltest_main.py $BINARY -q
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)

  - job: macOS
    pool:
      vmImage: macOS-latest
    steps:
    - checkout: self
      submodules: recursive
    - download: current
      artifact: macOSBinary
    - script: |
        set -euo pipefail
        set -v
        BINARY="$PIPELINE_WORKSPACE/macOSBinary/trojan"
        chmod +x "$BINARY"
        cd tests/LinuxFullTest/
        python3 -m venv "$AGENT_TEMPDIRECTORY/fulltest-venv"
        PYTHON="$AGENT_TEMPDIRECTORY/fulltest-venv/bin/python3"
        "$PYTHON" -m pip install PySocks psutil dnspython aioquic
        # Restore generated files even on failure; QUIC runs as the agent user.
        trap 'sudo -n chown -R "$(id -u):$(id -g)" "$PWD"' EXIT
        sudo -n env TF_BUILD=True "$PYTHON" -u fulltest_main.py "$BINARY" -g -n -d 5333 -f
        sudo -n chown -R "$(id -u):$(id -g)" "$PWD"
        "$PYTHON" -u fulltest_main.py "$BINARY" -q
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

- stage: Package
  jobs:

  - job: Linux
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: LinuxBinary
    - script: |
        set -euo pipefail
        BINARY="$PIPELINE_WORKSPACE/LinuxBinary/trojan"
        chmod +x "$BINARY"
        mkdir trojan
        cp "$BINARY" trojan/trojan
        cp -r examples LICENSE README.md trojan
        cp examples/server.json-example trojan/config.json
        tar cf trojan-linux-amd64.tar trojan
        xz trojan-linux-amd64.tar
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)
    - publish: $(System.DefaultWorkingDirectory)/trojan-linux-amd64.tar.xz
      artifact: LinuxRelease

  - job: macOS
    pool:
      vmImage: macOS-latest
    steps:
    - download: current
      artifact: macOSBinary
    - script: |
        set -euo pipefail
        set -v
        BINARY="$PIPELINE_WORKSPACE/macOSBinary/trojan"
        chmod +x "$BINARY"
        mkdir trojan
        cp "$BINARY" trojan/trojan
        cp -r examples LICENSE README.md trojan
        cp examples/client.json-example trojan/config.json
        rm trojan/examples/nat.json-example trojan/examples/trojan.service-example
        cat > trojan/start.command <<EOF
        #!/bin/sh

        cd "\$(dirname "\$0")"
        ./trojan
        EOF
        chmod +x trojan/start.command
        zip -r9 trojan-macos.zip trojan
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)
    - publish: $(System.DefaultWorkingDirectory)/trojan-macos.zip
      artifact: macOSRelease

  - job: Windows
    pool:
      vmImage: windows-latest
    steps:
    - download: current
      artifact: WindowsBinary
    - bash: |
        set -euo pipefail
        BINARY="$PIPELINE_WORKSPACE/WindowsBinary/trojan.exe"
        mkdir trojan
        cp "$BINARY" trojan/trojan.exe
        cp -r examples LICENSE README.md trojan
        cp examples/client.json-example trojan/config.json
        rm trojan/examples/nat.json-example trojan/examples/trojan.service-example
        7z a -mx=9 trojan-win.zip trojan
      env:
        PIPELINE_WORKSPACE: $(Pipeline.Workspace)
    - publish: $(System.DefaultWorkingDirectory)/trojan-win.zip
      artifact: WindowsRelease
